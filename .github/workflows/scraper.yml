name: OSM vendor scraper
on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
concurrency:
  group: osm-scraper
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        countries:
          - DE,AT,CH,LI,LU,BE,NL
          - FR,ES,PT,AD,MC,IT,SM
          - GB,IE,IS,NO,SE,FI,DK
          - PL,CZ,SK,HU,RO,BG,MD
          - EE,LV,LT,UA,BY
          - GR,CY,MT,TR,AL,MK
          - HR,SI,BA,RS,ME
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scrape:osm:test
      - run: npm run scrape:enrichment:test
      - run: npm run scrape -- --countries=${{ matrix.countries }} --nationwide --vendor-limit=30
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
